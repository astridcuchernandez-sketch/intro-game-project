<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Procedural Pixel Art World - True Match Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            image-rendering: pixelated;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="450"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- EXACT COLOR PALETTE MATCH ---
const SKY_COLOR = '#7bc1fa';
const GRASS_TOP = '#4dbb30';
const GRASS_BASE = '#115b22';
const DIRT_TOP = '#be532c';
const DIRT_BODY = '#802f1a';
const DIRT_DARK = '#431510';
const TREE_LEAF_LIGHT = '#6ee139';
const TREE_LEAF_BASE = '#3da324';
const TREE_LEAF_SHADOW = '#236916';
const TREE_TRUNK = '#954422';
const CLOUD_BODY = '#ffffff';
const CLOUD_SHADOW = '#9ed2fc';

// --- CONTROLS ---
let cameraX = 0;
const scrollSpeed = 2;

// --- BITMAP CACHING (Procedural Texture Assets Matching Image Styling) ---
function createTileSprite(width, height, renderFn) {
    const spriteCanvas = document.createElement('canvas');
    spriteCanvas.width = width;
    spriteCanvas.height = height;
    renderFn(spriteCanvas.getContext('2d'), width, height);
    return spriteCanvas;
}

// 1. Solid Ground & Step Top Floor Tile
const groundTile = createTileSprite(32, 32, (c, w, h) => {
    c.fillStyle = DIRT_BODY; c.fillRect(0, 0, w, h);
    // Heavy Dithering/Noise Texture
    c.fillStyle = DIRT_TOP; c.fillRect(2, 6, 4, 4); c.fillRect(16, 12, 6, 4); c.fillRect(8, 24, 4, 6);
    c.fillStyle = DIRT_DARK; c.fillRect(12, 4, 4, 4); c.fillRect(22, 20, 6, 6); c.fillRect(0, 16, 4, 4);
    // Grass Caps with Hanging Blades/Roots
    c.fillStyle = GRASS_BASE; c.fillRect(0, 0, w, 8);
    c.fillStyle = GRASS_TOP; c.fillRect(0, 0, w, 4);
    // Hanging grass blades details
    c.fillStyle = GRASS_BASE;
    c.fillRect(2, 8, 2, 4); c.fillRect(10, 8, 4, 2); c.fillRect(22, 8, 2, 5); c.fillRect(28, 8, 3, 2);
});

// 2. Vertical Cliff-Cut Wall Tile (For Pit Walls)
const cliffWallTile = createTileSprite(32, 32, (c, w, h) => {
    c.fillStyle = DIRT_BODY; c.fillRect(0, 0, w, h);
    // Shadow shading detailing on vertical edges
    c.fillStyle = DIRT_DARK; c.fillRect(0, 0, 8, h); c.fillRect(14, 8, 6, 8);
    c.fillStyle = DIRT_TOP; c.fillRect(24, 4, 4, 6); c.fillRect(8, 20, 4, 4);
});

// 3. Compact Bush Sprite
const bushSprite = createTileSprite(48, 24, (c, w, h) => {
    c.fillStyle = TREE_LEAF_SHADOW;
    c.beginPath(); c.arc(12, 16, 8, 0, Math.PI*2); c.arc(24, 14, 10, 0, Math.PI*2); c.arc(36, 16, 8, 0, Math.PI*2); c.fill();
    c.fillStyle = TREE_LEAF_BASE;
    c.beginPath(); c.arc(12, 13, 8, 0, Math.PI*2); c.arc(24, 10, 10, 0, Math.PI*2); c.arc(36, 13, 8, 0, Math.PI*2); c.fill();
    c.fillStyle = TREE_LEAF_LIGHT;
    c.beginPath(); c.arc(10, 10, 5, 0, Math.PI*2); c.arc(22, 7, 7, 0, Math.PI*2); c.arc(34, 10, 5, 0, Math.PI*2); c.fill();
});

// 4. Exact Image Proportions Tree Sprite
const treeSprite = createTileSprite(64, 96, (c, w, h) => {
    // Solid thick trunk
    c.fillStyle = TREE_TRUNK; c.fillRect(26, 48, 12, 48);
    c.fillStyle = DIRT_DARK; c.fillRect(26, 48, 3, 48); // Trunk outline shadow
    // Rounded leaf layers
    c.fillStyle = TREE_LEAF_SHADOW;
    c.beginPath(); c.arc(32, 32, 28, 0, Math.PI * 2); c.fill();
    c.fillStyle = TREE_LEAF_BASE;
    c.beginPath(); c.arc(32, 28, 26, 0, Math.PI * 2); c.fill();
    c.fillStyle = TREE_LEAF_LIGHT;
    c.beginPath(); c.arc(24, 20, 16, 0, Math.PI * 2); c.arc(40, 22, 14, 0, Math.PI * 2); c.fill();
});

// 5. Accurate Flat-Bottomed Floating Sky Clouds
const cloudSprite = createTileSprite(80, 32, (c, w, h) => {
    c.fillStyle = CLOUD_SHADOW;
    c.beginPath(); c.arc(20, 20, 12, 0, Math.PI * 2); c.arc(40, 16, 16, 0, Math.PI * 2); c.arc(60, 20, 12, 0, Math.PI * 2); c.fill();
    c.fillRect(8, 20, 64, 12);
    c.fillStyle = CLOUD_BODY;
    c.beginPath(); c.arc(20, 16, 12, 0, Math.PI * 2); c.arc(40, 12, 16, 0, Math.PI * 2); c.arc(60, 16, 12, 0, Math.PI * 2); c.fill();
    c.fillRect(8, 16, 64, 12);
});

// 6. Character Mockup Placeholder Sprite
const playerSprite = createTileSprite(24, 32, (c, w, h) => {
    c.fillStyle = '#a0522d'; c.fillRect(4, 0, 16, 14); // Hair
    c.fillStyle = '#ffdbac'; c.fillRect(6, 8, 12, 10); // Face
    c.fillStyle = '#4682b4'; c.fillRect(4, 18, 16, 10); // Shirt
    c.fillStyle = '#8b0000'; c.fillRect(6, 28, 4, 4); c.fillRect(14, 28, 4, 4); // Shoes
});

// --- SEEDED PSEUDO-RANDOM GENERATOR ---
function seededRandom(seed) {
    const x = Math.sin(seed++) * 10000;
    return x - Math.floor(x);
}

// --- CHUNK GENERATION ENGINE ---
const CHUNK_WIDTH = 416; // 13 Tiles per unit segment width
const activeChunks = {};

function generateChunk(chunkIndex) {
    const objects = { steps: [], clouds: [], trees: [], bushes: [], pits: [] };
    let seed = chunkIndex * 415.26;

    // 1. Layout Segment Elevation and Pits (Matching Image Layout)
    const segmentPattern = Math.floor(seededRandom(seed++) * 3); 
    
    if (segmentPattern === 0) {
        // Straight plain floor with an abrupt gap
        objects.pits.push({ startTile: 6, widthTiles: 2 });
    } else if (segmentPattern === 1) {
        // Raised plateau setup step (like the right-center portion of the user image)
        objects.steps.push({ startTile: 4, widthTiles: 5, heightY: 322 });
        objects.bushes.push({ x: 6 * 32 }); // Bush sits cleanly on top of the step platform
    } else {
        // Deep step valley formation layout
        objects.steps.push({ startTile: 0, widthTiles: 3, heightY: 322 });
        objects.pits.push({ startTile: 3, widthTiles: 3 });
        objects.steps.push({ startTile: 6, widthTiles: 4, heightY: 354 });
    }

    // Collect blocked locations to prevent overlapping decorations on gaps
    const blockedTiles = new Set();
    objects.pits.forEach(p => { for(let t=0; t<p.widthTiles; t++) blockedTiles.add(p.startTile + t); });

    // 2. High Frequency Clouds Coating Entire Sky Horizon
    const numClouds = 2 + Math.floor(seededRandom(seed++) * 2);
    for (let i = 0; i < numClouds; i++) {
        objects.clouds.push({
            x: seededRandom(seed++) * (CHUNK_WIDTH - 80),
            y: 20 + (i * 35) + (seededRandom(seed++) * 15)
        });
    }

    // 3. Precision Placed Cliff Edge Trees
    const numTrees = 1 + Math.floor(seededRandom(seed++) * 2);
    for (let i = 0; i < numTrees; i++) {
        const targetTile = Math.floor(seededRandom(seed++) * 11);
        if (!blockedTiles.has(targetTile)) {
            // Check if tree sits on ground or a raised custom step structure
            let treeY = 306;
            objects.steps.forEach(s => {
                if (targetTile >= s.startTile && targetTile < s.startTile + s.widthTiles) {
                    treeY = s.heightY - 80;
                }
            });
            objects.trees.push({ x: targetTile * 32, y: treeY });
        }
    }

    // 4. Ground Bushes
    if (seededRandom(seed++) > 0.4) {
        const targetTile = Math.floor(seededRandom(seed++) * 10);
        if (!blockedTiles.has(targetTile) && !blockedTiles.has(targetTile + 1)) {
            objects.bushes.push({ x: targetTile * 32 });
        }
    }

    return objects;
}

// --- RENDERING PIPELINE ---
function update() {
    cameraX += scrollSpeed;
}

function draw() {
    // Smooth Blue Sky Clearance Background
    ctx.fillStyle = SKY_COLOR;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const startChunk = Math.floor(cameraX / CHUNK_WIDTH);
    const endChunk = Math.floor((cameraX + canvas.width) / CHUNK_WIDTH);

    // --- LAYER 1: SKY HORIZON CLOUDS (Parallax Slower Stretched Layer) ---
    ctx.save();
    ctx.translate(-cameraX * 0.3, 0);
    for (let i = startChunk - 2; i <= endChunk + 2; i++) {
        if (!activeChunks[i]) activeChunks[i] = generateChunk(i);
        const chunkOffset = i * CHUNK_WIDTH;
        activeChunks[i].clouds.forEach(cloud => {
            ctx.drawImage(cloudSprite, chunkOffset + cloud.x, cloud.y);
        });
    }
    ctx.restore();

    // --- LAYER 2: INTERACTIVE GROUND CHUNKS ---
    ctx.save();
    ctx.translate(-cameraX, 0);

    for (let i = startChunk; i <= endChunk; i++) {
        const chunkOffset = i * CHUNK_WIDTH;
        const chunk = activeChunks[i];
        const defaultGroundY = 354; 

        // Draw Ground Tiles & Steps with Precision Gaps
        for (let t = 0; t < 13; t++) {
            const tileX = chunkOffset + (t * 32);
            
            // Check for Pit Gaps
            let inPit = false;
            chunk.pits.forEach(p => {
                if (t >= p.startTile && t < p.startTile + p.widthTiles) inPit = true;
            });

            // Check for Custom Step Elevations
            let currentGroundY = defaultGroundY;
            chunk.steps.forEach(s => {
                if (t >= s.startTile && t < s.startTile + s.widthTiles) currentGroundY = s.heightY;
            });

            if (!inPit) {
                // Render Floor Surface
                ctx.drawImage(groundTile, tileX, currentGroundY);
                // Fill Underneath Base Soil Solid Blocks
                ctx.fillStyle = DIRT_BODY;
                ctx.fillRect(tileX, currentGroundY + 32, 32, canvas.height - currentGroundY - 32);
            } else {
                // Pit void edge configurations (Exposes rocky cut cliffs on sides)
                ctx.fillStyle = '#4c1e13'; // Void accent base backfill color
                ctx.fillRect(tileX, defaultGroundY, 32, canvas.height - defaultGroundY);
                ctx.drawImage(cliffWallTile, tileX, defaultGroundY);
                ctx.drawImage(cliffWallTile, tileX, defaultGroundY + 32);
            }
        }

        // Draw Foliage Assets On Core Surfaces
        chunk.trees.forEach(tree => {
            ctx.drawImage(treeSprite, chunkOffset + tree.x, tree.y);
        });

        chunk.bushes.forEach(bush => {
            // Adjust bush layout height automatically based on if it falls onto step platforms
            let bushY = defaultGroundY - 14;
            chunk.steps.forEach(s => {
                if ((bush.x/32) >= s.startTile && (bush.x/32) < s.startTile + s.widthTiles) bushY = s.heightY - 14;
            });
            ctx.drawImage(bushSprite, chunkOffset + bush.x, bushY);
        });
    }

    // --- OPTIONAL: STATIC PLAYABLE CHARACTER MOCKUP OVERLAY ---
    // Places the little character at a fixed position right beside the first edge pit gap
    ctx.drawImage(playerSprite, cameraX + 160, 322);

    ctx.restore();

    // Cache cleanup routines
    for (const key in activeChunks) {
        if (key < startChunk - 4) delete activeChunks[key];
    }
}

function tick() {
    update();
    draw();
    requestAnimationFrame(tick);
}

tick();
</script>

</body>
</html>
