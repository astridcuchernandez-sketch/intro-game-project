<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Procedural Pixel Art World - Broken Ground</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            image-rendering: pixelated;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="450"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- PALETTE ---
const SKY_COLOR = '#3caed6';
const GRASS_TOP = '#1fc160';
const GRASS_BASE = '#117b3d';
const DIRT_TOP = '#aa6644';
const DIRT_BASE = '#663322';
const TREE_LEAF_LIGHT = '#2ecc71';
const TREE_LEAF_DARK = '#27ae60';
const TREE_TRUNK = '#5c3a21';
const CLOUD_BODY = '#ffffff';
const CLOUD_SHADOW = '#b4e1f0';

// --- CONTROLS ---
let cameraX = 0;
const scrollSpeed = 2;

// --- PROCEDURAL SPRITES ---
function createTileSprite(width, height, renderFn) {
    const spriteCanvas = document.createElement('canvas');
    spriteCanvas.width = width;
    spriteCanvas.height = height;
    renderFn(spriteCanvas.getContext('2d'), width, height);
    return spriteCanvas;
}

const groundTile = createTileSprite(32, 32, (c, w, h) => {
    c.fillStyle = DIRT_BASE; c.fillRect(0, 0, w, h);
    c.fillStyle = DIRT_TOP; c.fillRect(0, 0, w, 8);
    c.fillStyle = GRASS_BASE; c.fillRect(0, 0, w, 4);
    c.fillStyle = GRASS_TOP; c.fillRect(0, 0, w, 2);
});

const groundWallTile = createTileSprite(32, 32, (c, w, h) => {
    c.fillStyle = DIRT_BASE; c.fillRect(0, 0, w, h);
    c.fillStyle = DIRT_TOP; c.fillRect(0, 0, w, h);
    c.fillStyle = '#4d2618'; c.fillRect(0, 0, 4, h); // Side shading
});

const platformTile = createTileSprite(48, 16, (c, w, h) => {
    c.fillStyle = DIRT_BASE; c.fillRect(4, 4, w - 8, h - 4);
    c.fillStyle = DIRT_TOP; c.fillRect(4, 4, w - 8, 4);
    c.fillStyle = GRASS_TOP; c.fillRect(2, 0, w - 4, 3);
    c.fillStyle = GRASS_BASE; c.fillRect(2, 3, w - 4, 1);
});

const treeSprite = createTileSprite(64, 80, (c, w, h) => {
    c.fillStyle = TREE_TRUNK; c.fillRect(28, 40, 8, 40);
    c.fillStyle = TREE_LEAF_DARK; c.beginPath(); c.arc(32, 30, 24, 0, Math.PI * 2); c.fill();
    c.fillStyle = TREE_LEAF_LIGHT; c.beginPath(); c.arc(26, 24, 16, 0, Math.PI * 2); c.arc(40, 26, 14, 0, Math.PI * 2); c.fill();
});

const cloudSprite = createTileSprite(96, 40, (c, w, h) => {
    c.fillStyle = CLOUD_SHADOW;
    c.beginPath(); c.arc(24, 24, 16, 0, Math.PI * 2); c.arc(48, 24, 20, 0, Math.PI * 2); c.arc(72, 24, 16, 0, Math.PI * 2); c.fill();
    c.fillStyle = CLOUD_BODY;
    c.beginPath(); c.arc(24, 20, 16, 0, Math.PI * 2); c.arc(48, 16, 20, 0, Math.PI * 2); c.arc(72, 20, 16, 0, Math.PI * 2); c.fill();
});

// --- SEEDED PSEUDO-RANDOM GENERATOR ---
function seededRandom(seed) {
    const x = Math.sin(seed++) * 10000;
    return x - Math.floor(x);
}

// --- CHUNK GENERATION ENGINE ---
const CHUNK_WIDTH = 416; // Adjusted slightly to align tiles cleanly (13 tiles of 32px)
const activeChunks = {};

function generateChunk(chunkIndex) {
    const objects = { mountains: [], clouds: [], platforms: [], trees: [], potholes: [] };
    let seed = chunkIndex * 314.15;
    const groundY = 386;

    // 1. Procedural Potholes / Ground Pit Holes (0 to 2 per chunk)
    // Marks specific tile segments along the floor arrays where dirt blocks will be skipped
    const numPotholes = Math.floor(seededRandom(seed++) * 2.5);
    const usedTileIndices = new Set();
    
    for (let i = 0; i < numPotholes; i++) {
        // Find a random tile block index (from index 2 to 10 to avoid chunk border clipping issues)
        const tileIndex = 2 + Math.floor(seededRandom(seed++) * 8);
        const holeWidthTiles = 1 + Math.floor(seededRandom(seed++) * 2); // 1 to 2 tiles wide (32px - 64px wide holes)
        
        if (!usedTileIndices.has(tileIndex) && !usedTileIndices.has(tileIndex + 1)) {
            objects.potholes.push({
                startTile: tileIndex,
                widthTiles: holeWidthTiles
            });
            // Mark indices to prevent overlapping holes
            for (let t = 0; t < holeWidthTiles; t++) {
                usedTileIndices.add(tileIndex + t);
            }
        }
    }

    // 2. Mountains (1 to 2 per chunk)
    const numMountains = 1 + Math.floor(seededRandom(seed++) * 2);
    for (let i = 0; i < numMountains; i++) {
        const baseWidth = 90 + Math.floor(seededRandom(seed++) * 70); 
        const baseHeight = 35 + Math.floor(seededRandom(seed++) * 55); 
        const startX = seededRandom(seed++) * (CHUNK_WIDTH - baseWidth);
        
        objects.mountains.push({ x: startX, y: groundY - baseHeight, w: baseWidth, h: baseHeight });

        if (baseWidth > 110) {
            objects.mountains.push({ x: startX + 15, y: groundY - baseHeight - 15, w: baseWidth - 30, h: 15 });
        }
    }

    // 3. Floating Platforms (Lowered elevation)
    const numPlatforms = 2 + Math.floor(seededRandom(seed++) * 2);
    for (let i = 0; i < numPlatforms; i++) {
        objects.platforms.push({
            x: seededRandom(seed++) * (CHUNK_WIDTH - 60),
            y: 220 + (seededRandom(seed++) * 90) 
        });
    }

    // 4. Dense Sky-Filled Clouds (6 to 9 per chunk)
    const numClouds = 6 + Math.floor(seededRandom(seed++) * 4);
    for (let i = 0; i < numClouds; i++) {
        objects.clouds.push({
            x: seededRandom(seed++) * CHUNK_WIDTH,
            y: 5 + (i * 28) + (seededRandom(seed++) * 15), 
        });
    }

    // 5. Dense Tree Generation (Placed safely away from pothole voids)
    const numTrees = 2 + Math.floor(seededRandom(seed++) * 3); 
    for (let i = 0; i < numTrees; i++) {
        const treeTileX = Math.floor(seededRandom(seed++) * 11);
        if (!usedTileIndices.has(treeTileX)) {
            objects.trees.push({
                x: treeTileX * 32,
                y: 310
            });
        }
    }

    return objects;
}

// --- ENGINE LOOPS ---
function update() {
    cameraX += scrollSpeed;
}

function draw() {
    ctx.fillStyle = SKY_COLOR;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const startChunk = Math.floor(cameraX / CHUNK_WIDTH);
    const endChunk = Math.floor((cameraX + canvas.width) / CHUNK_WIDTH);

    // --- LAYER 1: UNBROKEN PARALLAX CLOUDS ---
    ctx.save();
    ctx.translate(-cameraX * 0.4, 0);
    for (let i = startChunk - 2; i <= endChunk + 2; i++) {
        if (!activeChunks[i]) activeChunks[i] = generateChunk(i);
        const chunkOffset = i * CHUNK_WIDTH;
        activeChunks[i].clouds.forEach(cloud => {
            ctx.drawImage(cloudSprite, chunkOffset + cloud.x, cloud.y);
        });
    }
    ctx.restore();

    // --- LAYER 2: FOREGROUND ENVIRONMENT ---
    ctx.save();
    ctx.translate(-cameraX, 0);

    for (let i = startChunk; i <= endChunk; i++) {
        const chunkOffset = i * CHUNK_WIDTH;
        const chunk = activeChunks[i];

        // Draw Mountains
        chunk.mountains.forEach(mtn => {
            const worldX = chunkOffset + mtn.x;
            ctx.fillStyle = '#895135';
            ctx.fillRect(worldX, mtn.y, mtn.w, mtn.h);
            ctx.fillStyle = '#6d3c23';
            ctx.fillRect(worldX, mtn.y, 8, mtn.h);
            ctx.fillStyle = GRASS_BASE;
            ctx.fillRect(worldX, mtn.y, mtn.w, 4);
            ctx.fillStyle = GRASS_TOP;
            ctx.fillRect(worldX, mtn.y, mtn.w, 2);
        });

        // Draw Forest Trees
        chunk.trees.forEach(tree => {
            ctx.drawImage(treeSprite, chunkOffset + tree.x, tree.y);
        });

        // Draw Lower Elevation Platforms
        chunk.platforms.forEach(plat => {
            ctx.drawImage(platformTile, chunkOffset + plat.x, plat.y);
        });

        // Draw Ground Floor with Dynamic Pothole Voids
        const groundY = canvas.height - 64;
        const totalTiles = CHUNK_WIDTH / 32;

        for (let t = 0; t < totalTiles; t++) {
            // Check if current tile location is marked inside a pothole array configuration
            let isHole = false;
            chunk.potholes.forEach(hole => {
                if (t >= hole.startTile && t < hole.startTile + hole.widthTiles) {
                    isHole = true;
                }
            });

            const tileX = chunkOffset + (t * 32);

            if (!isHole) {
                // Regular ground layout blocks
                ctx.drawImage(groundTile, tileX, groundY);
                ctx.drawImage(groundTile, tileX, groundY + 32);
            } else {
                // If it is a pothole hole, we skip the top layer completely 
                // and draw exposed vertical soil side-cut walls underground
                ctx.fillStyle = '#1c0d08'; // Dark backdrop depth for inside pit spaces
                ctx.fillRect(tileX, groundY, 32, 64);
                
                ctx.drawImage(groundWallTile, tileX, groundY + 24);
                ctx.drawImage(groundWallTile, tileX, groundY + 48);
            }
        }
    }

    ctx.restore();

    // Cache Cleaning
    for (const key in activeChunks) {
        if (key < startChunk - 4) delete activeChunks[key];
    }
}

function tick() {
    update();
    draw();
    requestAnimationFrame(tick);
}

tick();
</script>

</body>
</html>
